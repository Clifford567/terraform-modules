trigger:
- main

pool:
  vmImage: windows-latest

variables:
  terraformVersion: '1.6.6'
  workingDir: '$(System.DefaultWorkingDirectory)'
  aiSubdomain: ai-dev-$(Build.BuildId)

stages:

# =======================
# PLAN STAGE
# =======================
- stage: Terraform_Plan
  displayName: 'Terraform Plan (Client Review)'
  jobs:
  - job: Plan
    steps:

    - task: TerraformInstaller@1
      inputs:
        terraformVersion: $(terraformVersion)

    - task: TerraformTaskV4@4
      displayName: 'Terraform Init'
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(workingDir)'
        backendServiceArm: 'apei-poc-terraform'
        backendAzureRmResourceGroupName: 'apei-poc'
        backendAzureRmStorageAccountName: 'backendspoc'
        backendAzureRmContainerName: 'tfstate'
        backendAzureRmKey: 'dev.terraform.tfstate'
        commandOptions: '-reconfigure -upgrade'

    - script: |
        echo "Current directory:"
        cd
        dir
        echo "Listing environments folder:"
        dir environments
      workingDirectory: $(workingDir)
      displayName: 'Debug path'

    - task: TerraformTaskV4@4
      displayName: 'Terraform Plan'
      inputs:
        provider: azurerm
        command: plan
        environmentServiceNameAzureRM: apei-poc-terraform
        workingDirectory: $(workingDir)
        commandOptions: >
          -var-file=./environments/dev/dev.tfvars
          -var="ai_custom_subdomain=$(aiSubdomain)"
          -out=tfplan

    - powershell: |
        terraform show tfplan
      workingDirectory: $(workingDir)
      displayName: 'Show Terraform Plan'

    - publish: $(workingDir)
      artifact: terraform-plan


# =======================
# APPLY STAGE (Approval)
# =======================
- stage: Terraform_Apply
  dependsOn: Terraform_Plan
  condition: succeeded()

  jobs:
  - deployment: Apply
    environment: DEV
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self

          - task: TerraformInstaller@1
            inputs:
              terraformVersion: '1.6.6'

          - task: TerraformTaskV4@4
            displayName: Terraform Init
            inputs:
              provider: azurerm
              command: init
              backendServiceArm: apei-poc-terraform
              backendAzureRmResourceGroupName: apei-poc
              backendAzureRmStorageAccountName: backendspoc
              backendAzureRmContainerName: tfstate
              backendAzureRmKey: dev.terraform.tfstate

          - task: TerraformTaskV4@4
            displayName: Terraform Apply
            inputs:
              provider: azurerm
              command: apply
              environmentServiceNameAzureRM: apei-poc-terraform
              commandOptions: >
                -var-file=./environments/dev/dev.tfvars
                -var="ai_custom_subdomain=$(aiSubdomain)"
                -auto-approve

# =======================
# DESTROY STAGE (Approval)
# =======================
- stage: Terraform_Destroy
  displayName: 'Terraform Destroy (Requires Approval)'
  dependsOn: Terraform_Apply
  condition: succeeded()

  jobs:
  - deployment: Destroy
    environment: DEV   # <-- manual approval configured in this environment in Azure DevOps portal
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self

          - task: TerraformInstaller@1
            inputs:
              terraformVersion: '1.6.6'

          - task: TerraformTaskV4@4
            displayName: Terraform Init
            inputs:
              provider: azurerm
              command: init
              backendServiceArm: 'apei-poc-terraform'
              backendAzureRmResourceGroupName: 'apei-poc'
              backendAzureRmStorageAccountName: 'backendspoc'
              backendAzureRmContainerName: 'tfstate'
              backendAzureRmKey: 'dev.terraform.tfstate'

          - task: TerraformTaskV4@4
            displayName: Terraform Destroy
            inputs:
              provider: azurerm
              command: destroy
              environmentServiceNameAzureRM: 'apei-poc-terraform'
              commandOptions: >
                -var-file=./environments/dev/dev.tfvars
                -var="ai_custom_subdomain=$(aiSubdomain)"
                -auto-approve
